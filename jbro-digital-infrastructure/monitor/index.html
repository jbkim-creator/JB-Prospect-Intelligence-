<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JBRO | Private Deal Monitor</title>
<style>:root{font-family:system-ui,sans-serif;color-scheme:dark;--bg:#0b1420;--panel:#172435;--edge:#30445c;--txt:#ebf3fc;--accent:#87dfc9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt)}header,main{max-width:1150px;margin:auto;padding:20px}h1{font-size:24px}p,small{color:#afc4d4}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #526b85}input,select,textarea{background:#f5f9fc;color:#142339;width:100%}button{background:var(--accent);color:#082026;font-weight:600;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:8px 0 4px}fieldset{border:0;padding:0}form.grid,.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{padding:12px;background:var(--panel);border:1px solid var(--edge);border-radius:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--edge);vertical-align:top;font-size:13px}a{color:var(--accent)}.muted{color:#afc4d4}.error{color:#ffb0aa}#message{min-height:20px}@media(max-width:700px){form.grid,.filters{grid-template-columns:1fr}.wide{grid-column:1/-1}}</style></head><body>
<header><h1>JBRO Private Deal Monitor</h1><p>데이터센터 · 전력 · 에너지 인프라 | 관리자 1인용</p></header>
<main><section id="login" class="panel"><h2>관리자 로그인</h2><p>기존 Supabase 프로젝트와 승인된 관리자 계정이 필요합니다.</p><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section>
<section id="dashboard" class="hidden"><div class="row"><button id="reload">새로고침</button><button id="logout">로그아웃</button><span id="who" class="muted"></span></div><div class="stats" id="stats"></div>
<div class="panel"><h2>신규 거래 후보 등록</h2><form id="addForm" class="grid">
<label>공고명 *<input name="title" required maxlength="250"></label><label>자산명<input name="asset_name"></label><label>국가<input name="country"></label>
<label>분류<select name="category"><option value="data_center">데이터센터</option><option value="power">전력</option><option value="energy">에너지</option><option value="other">기타</option></select></label>
<label>거래 유형<select name="transaction_type"><option value="asset_sale">운영자산 매각</option><option value="development_site">개발사업/부지</option><option value="equity_ma">지분/M&A</option><option value="auction">경매/공개입찰</option><option value="other">기타</option></select></label>
<label>발표일<input name="announcement_date" type="date"></label>
<label class="wide">공식 출처 URL *<input name="source_url" type="url" required placeholder="https://..."></label>
<label>공개 거래규모<input name="disclosed_value"></label><label>공개 담당 연락처<input name="contact_public"></label><label>중개 가능성 점수 (0~100)<input name="brokerage_score" type="number" min="0" max="100" value="0"></label>
<label>후속 조치<input name="next_action"></label><label>기한<input name="next_action_due" type="date"></label><label>수수료 가정<input name="fee_estimate_note"></label>
<label class="wide">비공개 메모<textarea name="internal_notes" rows="2"></textarea></label><div class="wide"><button>중복 검사 후 저장</button></div></form></div>
<div class="panel"><h2>후보 목록</h2><div class="filters"><label>검색<input id="search" placeholder="공고명, 자산명, 국가"></label><label>검증 상태<select id="verification"><option value="">전체</option><option value="needs_review">검증 필요</option><option value="verified">검증됨</option><option value="rejected">제외</option></select></label><label>분류<select id="category"><option value="">전체</option><option value="data_center">데이터센터</option><option value="power">전력</option><option value="energy">에너지</option><option value="other">기타</option></select></label></div><div class="tablewrap"><table><thead><tr><th>공고/출처</th><th>지역/유형</th><th>발표일</th><th>검증 상태</th><th>점수</th><th>후속 조치</th><th>저장</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><p id="message" role="status"></p></main><script src="config.js"></script><script src="app.js"></script></body></html>
