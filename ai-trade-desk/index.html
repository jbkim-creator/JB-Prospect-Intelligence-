<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JBRO AI Trade Desk</title><meta name="description" content="AI-assisted global trade operations for SMEs"><style>*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#eff6ff;font:17px/1.65 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(36px,7vw,68px);line-height:1.1;letter-spacing:-2px}h2{margin-top:48px}p{color:#b9c9da}button,a.cta{background:#50e3c2;color:#08241f;border:0;padding:13px 20px;border-radius:8px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}#lang{background:#20354c;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:#14263b;border:1px solid #2b4158;border-radius:14px;padding:22px}label{display:block;margin:12px 0}input{padding:10px;border-radius:6px;width:100%;font:inherit}footer{margin-top:48px;color:#9eb1c4;font-size:13px}small{color:#b9c9da}</style><main><header><b>JBRO / AI TRADE DESK</b><button id="lang">EN</button></header><section id="content"></section><footer>JBRO AI Trade Desk · <a style="color:#50e3c2" href="mailto:jbkim@jbrocap.com">jbkim@jbrocap.com</a></footer></main><script>let en=false;const t=(k,e)=>en?e:k;function render(){document.documentElement.lang=en?'en':'ko';document.querySelector('#lang').textContent=en?'한국어':'EN';document.querySelector('#content').innerHTML='<p>GLOBAL TRADE · AI-ASSISTED OPERATIONS</p><h1>'+t('당신의 AI 무역팀','Your AI-powered trade team')+'</h1><p>'+t('해외 바이어 발굴부터 공급처 탐색, 견적 비교, 후속 업무까지. JBRO가 AI와 운영 지원을 결합해 무역 업무를 돕습니다.','From buyer discovery and sourcing to quote comparison and follow-ups. JBRO combines AI-assisted research with managed trade operations.')+'</p><a class="cta" href="#diagnosis">'+t('무료 업무 진단','Free workflow assessment')+'</a> <a class="cta" href="mailto:jbkim@jbrocap.com?subject=Trade%20Desk%20Pilot">'+t('7일 파일럿 상담','Request a 7-day pilot')+'</a><h2>'+t('지원 업무','What we support')+'</h2><div class="grid">'+[['해외 영업','Buyer discovery'],['공급처 발굴','Supplier sourcing'],['견적 비교','Quote comparison'],['거래 후속 관리','Trade follow-ups'],['시장 정보','Market intelligence'],['업무 리포트','Activity reporting']].map(x=>'<div class="card"><b>'+t(...x)+'</b></div>').join('')+'</div><h2 id="single">'+t('단건 유료 소싱','One-off sourcing report')+'</h2><div class="card"><b>'+t('품번 1개 집중 조사','One part number · supplier research')+'</b><h3>KRW 99,000</h3><p>'+t('공급처 후보 최대 5곳 (확인 가능한 범위), 공개 출처·연락처, 견적 비교 양식, RFQ 초안 제공. 실제 재고·가격·거래 성사는 보장하지 않습니다.','Up to five potential suppliers where available, public source links and contacts, quote comparison template and RFQ draft. Stock, prices and successful transactions are not guaranteed.')+'</p><form id="order"><label>'+t('회사명','Company')+'<input id="company" required maxlength="120"></label><label>'+t('품번','Part number')+'<input id="pn" required maxlength="120"></label><label>'+t('희망 수량','Quantity')+'<input id="qty" type="number" min="1" required></label><label>'+t('희망 납기','Target delivery date')+'<input id="due" type="date"></label><button type="submit">'+t('99,000원 상품 신청','Request KRW 99,000 service')+'</button></form><p><small>'+t('신청 시 이메일 앱이 열립니다. 업무 범위 및 세금 포함 여부, 결제 방법을 안내받은 후 결제합니다. 무료 파일럿은 별도 협의 가능합니다.','Opens your email app to request an order. Scope, applicable taxes and payment instructions are confirmed before payment. Free pilot available by agreement.')+'</small></p></div><h2>'+t('월간 서비스 요금','Monthly service plans')+'</h2><div class="grid">'+[['Starter','490,000','1'],['Business','990,000','3'],['Professional','1,990,000','6']].map(x=>'<div class="card"><b>'+x[0]+'</b><h3>KRW '+x[1]+'</h3><p>'+t('지원 업무 영역 최대 ','Up to ')+x[2]+t('개',' workflows')+'</p><a class="cta" href="mailto:jbkim@jbrocap.com?subject=AI%20Trade%20Desk%20'+x[0]+'">'+t('상담 신청','Request consultation')+'</a></div>').join('')+'</div><p>'+t('별도 거래 중개 수수료는 사전 협의합니다. 7일 무료 파일럿은 업무 범위 협의 후 제공됩니다.','Transaction fees, if applicable, are agreed separately. Free seven-day pilot subject to scope agreement.')+'</p><h2 id="diagnosis">'+t('무료 업무 진단','Free workflow assessment')+'</h2><div class="card"><label>'+t('월간 반복 업무 시간','Monthly repetitive work hours')+'<input id="hrs" type="number" min="0" value="40"></label><label>'+t('시간당 인건비 (원)','Hourly labor cost (KRW)')+'<input id="rate" type="number" min="0" value="25000"></label><button id="calc">'+t('잠재 절감액 계산','Estimate potential savings')+'</button><p id="result" aria-live="polite"></p><small>'+t('규칙 기반 예시 계산이며 실제 절감 효과를 보장하지 않습니다. 고객 승인 후 업무를 수행하는 운영대행 MVP입니다.','Illustrative rule-based estimate, not guaranteed savings. Managed-service MVP with customer approval.')+'</small></div>';document.querySelector('#order').onsubmit=(ev)=>{ev.preventDefault();const value=id=>document.getElementById(id).value;const subject=t('단건 소싱 신청','One-off sourcing order request');const body=[t('회사: ','Company: ')+value('company'),t('품번: ','Part number: ')+value('pn'),t('수량: ','Quantity: ')+value('qty'),t('희망 납기: ','Target delivery: ')+value('due'),t('99,000원 상품의 결제 및 진행 안내를 요청합니다.','Please confirm scope and payment instructions for the KRW 99,000 service.')].join('\n');location.href='mailto:jbkim@jbrocap.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);};document.querySelector('#calc').onclick=()=>{let h=Math.max(0,Number(document.querySelector('#hrs').value)||0),r=Math.max(0,Number(document.querySelector('#rate').value)||0);document.querySelector('#result').textContent=t('업무시간 30% 절감 가정: 월 ','Assuming 30% time savings: KRW ')+Math.round(h*r*.3).toLocaleString()+t('원',' / month');};}document.querySelector('#lang').onclick=()=>{en=!en;render()};render();</script></html>
