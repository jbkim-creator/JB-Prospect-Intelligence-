name: AI Visibility measured pilot (manual only)

on:
  workflow_dispatch:
    inputs:
      execute_paid_calls:
        description: "I approve billable OpenAI Responses API calls"
        type: boolean
        required: true
        default: false
      max_calls:
        description: "Maximum model requests (1 to 3)"
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check offline tests before use
        working-directory: ai-visibility
        run: python3 -m unittest discover -s tools/tests -v
      - name: Dry run, no provider API request
        if: ${{ inputs.execute_paid_calls != true }}
        working-directory: ai-visibility
        run: python3 tools/collect_openai_web_search.py --max-calls ${{ inputs.max_calls }}
      - name: Confirm securely configured API key
        if: ${{ inputs.execute_paid_calls == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured in repository Actions secrets"
            exit 1
          fi
      - name: Execute expressly approved limited paid calls
        if: ${{ inputs.execute_paid_calls == true }}
        working-directory: ai-visibility
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/collect_openai_web_search.py --execute --confirm-paid-calls YES --max-calls ${{ inputs.max_calls }} --output evidence-openai.json
      - name: Validate evidence before saving
        if: ${{ inputs.execute_paid_calls == true }}
        working-directory: ai-visibility
        run: python3 tools/validate_evidence.py evidence-openai.json
      - name: Save evidence as private GitHub run artifact (retained 1 day)
        if: ${{ inputs.execute_paid_calls == true && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-visibility-evidence
          path: ai-visibility/evidence-openai.json
          retention-days: 1
          if-no-files-found: error
